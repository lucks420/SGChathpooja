<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E65100"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="300" height="300" rx="16" fill="#FFF8E7" stroke="#FFC107" stroke-width="4"/>
  
  <!-- Outer Decorative Corner Marks (QR style) -->
  <!-- Top Left -->
  <rect x="25" y="25" width="60" height="60" rx="8" fill="none" stroke="#E65100" stroke-width="8"/>
  <rect x="41" y="41" width="28" height="28" rx="4" fill="#E65100"/>
  
  <!-- Top Right -->
  <rect x="215" y="25" width="60" height="60" rx="8" fill="none" stroke="#E65100" stroke-width="8"/>
  <rect x="231" y="41" width="28" height="28" rx="4" fill="#E65100"/>
  
  <!-- Bottom Left -->
  <rect x="25" y="215" width="60" height="60" rx="8" fill="none" stroke="#E65100" stroke-width="8"/>
  <rect x="41" y="231" width="28" height="28" rx="4" fill="#E65100"/>

  <!-- Simulated QR Pattern Matrix (Styled to be unmistakably a demo placeholder) -->
  <g fill="#75665D" opacity="0.65">
    <rect x="100" y="30" width="16" height="16" rx="2"/>
    <rect x="125" y="30" width="20" height="16" rx="2"/>
    <rect x="155" y="30" width="16" height="16" rx="2"/>
    <rect x="180" y="30" width="18" height="16" rx="2"/>
    
    <rect x="100" y="55" width="24" height="16" rx="2"/>
    <rect x="135" y="55" width="16" height="16" rx="2"/>
    <rect x="160" y="55" width="25" height="16" rx="2"/>
    
    <rect x="30" y="100" width="18" height="18" rx="2"/>
    <rect x="60" y="100" width="25" height="18" rx="2"/>
    <rect x="215" y="100" width="20" height="18" rx="2"/>
    <rect x="245" y="100" width="25" height="18" rx="2"/>
    
    <rect x="30" y="130" width="25" height="16" rx="2"/>
    <rect x="65" y="130" width="16" height="16" rx="2"/>
    <rect x="220" y="130" width="28" height="16" rx="2"/>
    <rect x="255" y="130" width="15" height="16" rx="2"/>

    <rect x="30" y="160" width="20" height="20" rx="2"/>
    <rect x="60" y="160" width="28" height="20" rx="2"/>
    <rect x="215" y="160" width="18" height="20" rx="2"/>
    <rect x="240" y="160" width="30" height="20" rx="2"/>
    
    <rect x="100" y="225" width="20" height="16" rx="2"/>
    <rect x="130" y="225" width="25" height="16" rx="2"/>
    <rect x="165" y="225" width="16" height="16" rx="2"/>
    <rect x="190" y="225" width="18" height="16" rx="2"/>
    
    <rect x="100" y="250" width="25" height="20" rx="2"/>
    <rect x="135" y="250" width="18" height="20" rx="2"/>
    <rect x="165" y="250" width="24" height="20" rx="2"/>
    <rect x="230" y="230" width="35" height="35" rx="4"/>
  </g>

  <!-- Large Central Warning Banner that prevents ANY accidental scanning -->
  <rect x="35" y="95" width="230" height="110" rx="12" fill="#B71C1C" stroke="#FFF8E7" stroke-width="3" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))"/>
  
  <text x="150" y="128" fill="#FFF8E7" font-family="'Noto Sans Devanagari', sans-serif" font-weight="700" font-size="19" text-anchor="middle">
    केवल डेमो QR कोड
  </text>
  <text x="150" y="152" fill="#FFC107" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" letter-spacing="1.5" text-anchor="middle">
    DEMO ONLY
  </text>
  <text x="150" y="174" fill="#FFFFFF" font-family="'Noto Sans Devanagari', sans-serif" font-weight="500" font-size="12" text-anchor="middle">
    भुगतान हेतु अमान्य / Not For Payment
  </text>
  <text x="150" y="192" fill="#FFF8E7" opacity="0.8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">
    REPLACE WITH REAL QR IN CONFIG
  </text>
</svg>
